name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install -r backend/requirements.txt pytest ruff
      - name: Lint (syntax errors and pyflakes)
        run: ruff check . --select E9,F
      - name: Tests
        run: pytest
      - name: Headless demo
        run: python demos/run_demo.py --teams 2 --drones 4 --ticks 120 --faults

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  firmware:
    runs-on: ubuntu-latest
    # Non-blocking until the firmware has a known-good build on CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP32 firmware
        run: pio run -d firmware/esp32_sim
